syntax = "proto3";

package registry.v1;

// Registry is the protobuf publish gate. It stores immutable schema
// versions and answers compatibility questions with descriptor-level
// evidence for both the binary wire encoding and the JSON mapping.
//
// The Go service in internal/registry implements exactly this surface
// (hand-wired ConnectRPC handlers with a JSON codec, no codegen step);
// this file is the canonical contract for clients and future codegen.
service Registry {
  // RegisterVersion publishes an immutable version. The same version with
  // different content is rejected (AlreadyExists); identical content is an
  // idempotent no-op. When a base version exists, the response carries an
  // evidence-based compatibility report. With require_compatible, a proven
  // INCOMPATIBLE version is refused before anything is stored.
  rpc RegisterVersion(RegisterVersionRequest) returns (RegisterVersionResponse);

  // CheckCompatibility compares a registered base version against another
  // registered version or inline candidate files, optionally with sample
  // payloads and a consumer projection.
  rpc CheckCompatibility(CheckRequest) returns (CheckResponse);

  // DeclareConsumer records which messages/fields a consumer reads and
  // over which encoding, so checks can be projected onto that surface.
  rpc DeclareConsumer(DeclareConsumerRequest) returns (DeclareConsumerResponse);

  // ListVersions returns every registered version of a package.
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);

  // CreateCorpusSet creates a new draft corpus, optionally cloning a sealed
  // base and applying an add/update/delete delta.
  rpc CreateCorpusSet(CreateCorpusSetRequest) returns (CorpusSetResponse);
  // UpdateCorpusSet mutates a draft. Re-uploading the same content is a
  // no-op; sealed versions cannot be changed.
  rpc UpdateCorpusSet(UpdateCorpusSetRequest) returns (CorpusSetResponse);
  rpc SealCorpusSet(SealCorpusSetRequest) returns (CorpusSetResponse);
  rpc DeleteCorpusDraft(DeleteCorpusDraftRequest) returns (DeleteCorpusDraftResponse);
  rpc GetCorpusSet(GetCorpusSetRequest) returns (CorpusSetResponse);
  rpc ListCorpusSets(ListCorpusSetsRequest) returns (ListCorpusSetsResponse);

  // StartReplay creates the unique replay for a sealed corpus/schema pair,
  // or returns the existing one. Work is resumable and item results are
  // idempotent.
  rpc StartReplay(StartReplayRequest) returns (ReplayResponse);
  rpc GetReplay(GetReplayRequest) returns (ReplayResponse);
}

message ProtoFile {
  string path = 1;
  string content = 2;
}

message Sample {
  string name = 1;
  string message = 2;  // fully-qualified message name
  string encoding = 3; // "json" or "wire"
  string data = 4;     // JSON text, or base64 for wire
}

message Finding {
  string code = 1;
  string severity = 2;   // FAIL | WARN | INFO
  string dimension = 3;  // WIRE | JSON | BOTH
  string message = 4;    // fully-qualified message/enum name
  string path = 5;       // field path within the message
  string detail = 6;
}

message Report {
  string verdict = 1; // COMPATIBLE | NEEDS_REVIEW | INCOMPATIBLE
  repeated Finding findings = 2;
}

message RegisterVersionRequest {
  string package = 1;
  string version = 2;
  repeated ProtoFile files = 3;
  string base_version = 4;          // default: latest registered
  repeated Sample samples = 5;
  bool require_compatible = 6;
}

message RegisterVersionResponse {
  string package = 1;
  string version = 2;
  string content_hash = 3;
  bool already_existed = 4;
  string base_version = 5;
  Report compatibility = 6;
}

message CheckRequest {
  string package = 1;
  string base_version = 2;
  string candidate_version = 3;        // or:
  repeated ProtoFile candidate_files = 4;
  repeated Sample samples = 5;
  string consumer = 6;
}

message CheckResponse {
  string base_version = 1;
  string head_version = 2;
  Report report = 3;
  ConsumerImpact consumer_impact = 4;
}

message ConsumerImpact {
  string consumer = 1;
  string encoding = 2;
  string verdict = 3;
  repeated Finding findings = 4;
}

message Usage {
  string message = 1;        // fully-qualified message name
  repeated string fields = 2; // field paths; empty = whole message
}

message DeclareConsumerRequest {
  string package = 1;
  string consumer = 2;
  string encoding = 3; // wire | json | both
  repeated Usage usages = 4;
}

message DeclareConsumerResponse {
  bool declared = 1;
}

message ListVersionsRequest {
  string package = 1;
}

message VersionMeta {
  string version = 1;
  string content_hash = 2;
  string created_at = 3;
}

message ListVersionsResponse {
  string package = 1;
  repeated VersionMeta versions = 2;
}

message ExpectedResult {
  string outcome = 1;        // success (default) or failure
  string error_contains = 2; // optional substring for expected failures
  string json = 3;           // optional canonical JSON expectation
}

message CorpusSampleInput {
  string key = 1;             // stable key within a corpus; defaults to content fingerprint
  string name = 2;
  string message = 3;
  string encoding = 4;        // json or wire
  string data = 5;            // JSON text, or base64 for wire
  ExpectedResult expected_result = 6;
  string content_summary = 7; // optional override; normally service-generated
}

message CorpusSample {
  string key = 1;
  string name = 2;
  string message = 3;
  string encoding = 4;
  string data = 5;
  ExpectedResult expected_result = 6;
  string content_summary = 7;
  string fingerprint = 8;
  string created_at = 9;
}

message CorpusSetMeta {
  string name = 1;
  int32 version = 2;
  string status = 3; // DRAFT or SEALED
  optional int32 base_version = 4;
  int32 total = 5;
  string created_at = 6;
  string sealed_at = 7;
}

message CreateCorpusSetRequest {
  string package = 1;
  string name = 2;
  int32 version = 3;      // default: append after latest
  int32 base_version = 4; // default: latest sealed; -1 means no base
  repeated CorpusSampleInput add_or_update = 5;
  repeated string delete_keys = 6;
}

message UpdateCorpusSetRequest {
  string package = 1;
  string name = 2;
  int32 version = 3;
  repeated CorpusSampleInput add_or_update = 4;
  repeated string delete_keys = 5;
}

message SealCorpusSetRequest {
  string package = 1;
  string name = 2;
  int32 version = 3;
}

message DeleteCorpusDraftRequest {
  string package = 1;
  string name = 2;
  int32 version = 3;
}

message DeleteCorpusDraftResponse {
  bool deleted = 1;
}

message GetCorpusSetRequest {
  string package = 1;
  string name = 2;
  int32 version = 3; // 0 means latest
}

message ListCorpusSetsRequest {
  string package = 1;
  string name = 2;
}

message CorpusSetResponse {
  CorpusSetMeta meta = 1;
  repeated CorpusSample samples = 2;
}

message ListCorpusSetsResponse {
  string package = 1;
  repeated CorpusSetMeta sets = 2;
}

message StartReplayRequest {
  string package = 1;
  string corpus_name = 2;
  int32 corpus_version = 3; // 0 means latest sealed
  string schema_version = 4;
}

message GetReplayRequest {
  string replay_id = 1;
  string package = 2;
  string corpus_name = 3;
  int32 corpus_version = 4;
  string schema_version = 5;
}

message ReplaySummary {
  string replay_id = 1;
  string package = 2;
  string corpus_name = 3;
  int32 corpus_version = 4;
  string schema_version = 5;
  string status = 6; // PENDING, RUNNING, COMPLETE or FAILED
  int32 total = 7;
  int32 succeeded = 8;
  int32 failed = 9;
  int32 missing_field_items = 10;
  int32 json_diff_items = 11;
  string started_at = 12;
  string updated_at = 13;
  string error = 14;
}

message JSONDiff {
  string path = 1;
  string expected = 2;
  string actual = 3;
}

message ReplayItem {
  string key = 1;
  string name = 2;
  string message = 3;
  string encoding = 4;
  string status = 5; // SUCCESS or FAILED
  string error = 6;
  repeated string missing_fields = 7;
  repeated JSONDiff json_diffs = 8;
  string decoded_json = 9;
}

message ReplayResponse {
  ReplaySummary summary = 1;
  repeated ReplayItem items = 2;
}
